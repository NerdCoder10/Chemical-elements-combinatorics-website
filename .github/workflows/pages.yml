# Publishes the site to GitHub Pages (https://nerdcoder10.github.io/Chemical-elements-combinatorics-website/)
# and turns Pages on for the repository if it is not on yet.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/determined-mendel-jj6i5a]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: node tests/engine.test.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
